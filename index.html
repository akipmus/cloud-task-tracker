<!doctype html>
<!-- Tells the browser to use modern HTML -->

<html lang="en">
<!-- Starts the webpage and sets its language -->

<head>
  <!-- Holds page settings and information -->
  <meta charset="UTF-8">
  <!-- Helps the page display text and symbols correctly -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Helps the page fit phone and computer screens -->

  <title>My Cloud Project</title>
  <!-- Sets the text shown on the browser tab -->

  <link rel="stylesheet" href="style.css">
  <!-- Loads the styles from the style.css file -->
</head>

<body>
  <!-- Holds the content visitors see -->

  <main>
    <!-- Groups the main content of the page -->
     
        <!-- Shows the current step's status -->
    <p id="status">Status: Not completed yet.</p>

    <!-- Adds a button the visitor can click -->
    <button id="completeButton">Mark this step complete</button>
  </main>

  <!-- Loads the JavaScript file that makes the button work -->
  <script src="script.js"></script>
</body>

    <h1>My Cloud Journey</h1>
    <!-- Main heading -->

    <p>I'm learning cloud by building a task tracker.</p>
    <!-- A paragraph of text -->

    <h2>My first project</h2>
    <!-- A smaller section heading -->

    <ul>
      <!-- Starts a bulleted list -->
      <li>Project: Task Tracker</li>
      <!-- One list item -->

      <li>Stage: Beginner</li>
      <!-- Another list item -->

      <li>Current goal: Build a webpage</li>
      <!-- Another list item -->
    </ul>
  </main>
</body>
</html>
<!-- Ends the webpage -->
